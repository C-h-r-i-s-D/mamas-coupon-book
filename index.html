<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mama's Coupon Book 💝</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --rose:       #e8739a;
    --rose-deep:  #c94f78;
    --plum:       #6b3fa0;
    --plum-light: #9b6fd0;
    --blush:      #f4b8ce;
    --cream:      #fdf0f5;
    --dark:       #1a0f1e;
    --dark-mid:   #2d1b35;
    --dark-card:  #231529;
    --gold:       #f0c060;
    --text-soft:  rgba(255,255,255,0.6);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%;
    background: var(--dark);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }

  /* ── BACKGROUND ── */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(107,63,160,0.35) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 85% 90%, rgba(232,115,154,0.25) 0%, transparent 55%),
      radial-gradient(ellipse 50% 40% at 60% 50%, rgba(107,63,160,0.1) 0%, transparent 70%),
      var(--dark);
    pointer-events: none;
  }

  /* ── MAIN VIEWER ── */
  #app {
    position: fixed; inset: 0; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  /* ── PAGE COUNTER ── */
  #page-counter {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    z-index: 20;
    background: rgba(35,21,41,0.75);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(232,115,154,0.25);
    border-radius: 20px;
    padding: 5px 16px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-soft);
    letter-spacing: 0.05em;
    pointer-events: none;
  }
  #page-counter span { color: var(--blush); }

  /* ── FLIPBOOK STAGE ── */
  #stage {
    position: relative;
    width: 100%;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ── PAGE WRAPPER ── */
  .page-wrap {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.42s cubic-bezier(0.4,0,0.2,1), opacity 0.42s ease;
  }
  .page-wrap.active   { transform: translateX(0);     opacity: 1; z-index: 2; }
  .page-wrap.prev     { transform: translateX(-100%); opacity: 0; z-index: 1; }
  .page-wrap.next     { transform: translateX(100%);  opacity: 0; z-index: 1; }
  .page-wrap.hidden   { transform: translateX(100%);  opacity: 0; z-index: 0; display: none; }

  /* ── PAGE CARD ── */
  .page-card {
    position: relative;
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 160px);
    border-radius: 12px;
    overflow: hidden;
    box-shadow:
      0 8px 40px rgba(0,0,0,0.55),
      0 0 0 1px rgba(255,255,255,0.06),
      inset 0 1px 0 rgba(255,255,255,0.08);
    touch-action: none;
  }

  .page-card img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    -webkit-user-drag: none;
  }

  /* ── REDEEMED STAMP ── */
  .stamp-overlay {
    position: absolute;
    top: 14px; right: 14px;
    display: flex; flex-direction: column; align-items: center;
    background: rgba(201,79,120,0.82);
    backdrop-filter: blur(4px);
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 10px;
    padding: 5px 11px 6px;
    pointer-events: none;
    z-index: 5;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  .stamp-overlay .stamp-word {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.04em;
    line-height: 1;
  }
  .stamp-overlay .stamp-date {
    font-size: 10px;
    color: rgba(255,255,255,0.8);
    margin-top: 2px;
    letter-spacing: 0.06em;
  }
  .stamp-overlay::before {
    content: '✦';
    font-size: 8px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 2px;
  }

  /* ── NAV ARROWS ── */
  .nav-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 15;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: rgba(35,21,41,0.7);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(232,115,154,0.2);
    color: rgba(255,255,255,0.7);
    font-size: 18px;
    transition: all 0.2s ease;
  }
  .nav-btn:hover  { background: rgba(201,79,120,0.5); color: #fff; border-color: var(--rose); }
  .nav-btn:active { transform: translateY(-50%) scale(0.92); }
  .nav-btn.disabled { opacity: 0.25; pointer-events: none; }
  #btn-prev { left: 8px; }
  #btn-next { right: 8px; }

  /* ── REDEEM BUTTON ── */
  #redeem-btn {
    position: fixed;
    bottom: 18px; left: 16px;
    z-index: 20;
    width: 56px; height: 56px;
    border-radius: 50%;
    border: none; cursor: pointer;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    transition: all 0.2s ease;
    font-family: 'DM Sans', sans-serif;
  }
  #redeem-btn.available {
    background: linear-gradient(135deg, var(--rose-deep), var(--plum));
    box-shadow: 0 4px 20px rgba(201,79,120,0.55);
  }
  #redeem-btn.redeemed {
    background: rgba(35,21,41,0.75);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: none;
  }
  #redeem-btn:active { transform: scale(0.92); }

  /* ── DASHBOARD FAB ── */
  #fab {
    position: fixed;
    bottom: 18px; right: 16px;
    z-index: 20;
    width: 56px; height: 56px;
    border-radius: 50%;
    border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--plum), var(--rose-deep));
    box-shadow: 0 4px 20px rgba(107,63,160,0.55);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: all 0.2s ease;
  }
  #fab:active { transform: scale(0.92); }
  #fab .fab-icon  { font-size: 16px; line-height: 1; }
  #fab .fab-count { font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.85); margin-top: 1px; }

  /* ── DASHBOARD OVERLAY ── */
  #dashboard {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(15,7,20,0.88);
    backdrop-filter: blur(18px);
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none;
    transition: opacity 0.28s ease;
  }
  #dashboard.open { opacity: 1; pointer-events: all; }

  #dash-header {
    padding: 56px 24px 20px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  #dash-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    color: #fff;
  }
  #dash-title small {
    display: block;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 300;
    color: var(--text-soft);
    margin-top: 2px;
    font-style: normal;
  }
  #dash-close {
    width: 38px; height: 38px;
    border-radius: 50%; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.07);
    color: #fff; font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  #dash-close:hover { background: rgba(255,255,255,0.15); }

  /* ── TABS ── */
  #dash-tabs {
    display: flex; gap: 10px;
    padding: 0 24px 18px;
    flex-shrink: 0;
  }
  .dash-tab {
    flex: 1;
    padding: 10px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: var(--text-soft);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .dash-tab.active {
    background: linear-gradient(135deg, rgba(201,79,120,0.35), rgba(107,63,160,0.35));
    border-color: rgba(232,115,154,0.4);
    color: #fff;
  }
  .dash-tab .tab-count {
    display: inline-block;
    background: rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 1px 8px;
    font-size: 12px;
    margin-left: 6px;
  }
  .dash-tab.active .tab-count {
    background: rgba(232,115,154,0.3);
  }

  /* ── COUPON LIST ── */
  #dash-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 24px 32px;
    -webkit-overflow-scrolling: touch;
  }
  #dash-list::-webkit-scrollbar { display: none; }

  .coupon-list-item {
    display: flex; align-items: center;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.07);
    background: rgba(255,255,255,0.04);
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.18s ease;
    gap: 14px;
  }
  .coupon-list-item:hover, .coupon-list-item:active {
    background: rgba(232,115,154,0.12);
    border-color: rgba(232,115,154,0.25);
    transform: translateX(3px);
  }
  .coupon-list-item .item-cat {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--plum-light);
    font-weight: 500;
    flex-shrink: 0;
    width: 5px;
    height: 36px;
    border-radius: 3px;
    background: currentColor;
  }
  .coupon-list-item .item-text { flex: 1; min-width: 0; }
  .coupon-list-item .item-name {
    font-size: 15px;
    font-weight: 500;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .coupon-list-item .item-sub {
    font-size: 11px;
    color: var(--text-soft);
    margin-top: 2px;
  }
  .coupon-list-item .item-arrow {
    color: var(--text-soft);
    font-size: 14px;
    flex-shrink: 0;
  }
  .coupon-list-item.redeemed .item-name { color: rgba(255,255,255,0.55); }
  .coupon-list-item .redeemed-badge {
    font-size: 10px;
    background: rgba(201,79,120,0.25);
    color: var(--rose);
    border-radius: 6px;
    padding: 2px 7px;
    flex-shrink: 0;
  }

  .dash-section-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-soft);
    font-weight: 500;
    padding: 14px 0 8px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 10px;
  }

  /* ── LOADING ── */
  #loading {
    position: fixed; inset: 0; z-index: 100;
    background: var(--dark);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
    transition: opacity 0.5s ease;
  }
  #loading.fade { opacity: 0; pointer-events: none; }
  #loading .load-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-style: italic;
    color: var(--blush);
    letter-spacing: 0.02em;
  }
  #loading .load-sub {
    font-size: 13px;
    color: var(--text-soft);
    letter-spacing: 0.05em;
  }
  .load-bar {
    width: 180px; height: 2px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
  }
  .load-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--rose), var(--plum-light));
    border-radius: 2px;
    width: 0%;
    transition: width 0.3s ease;
  }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(10px);
    z-index: 60;
    background: rgba(35,21,41,0.92);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(232,115,154,0.3);
    border-radius: 20px;
    padding: 9px 20px;
    font-size: 13px;
    color: var(--blush);
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── ZOOM HINT ── */
  #zoom-hint {
    position: fixed; top: 50px; left: 50%; transform: translateX(-50%);
    z-index: 16;
    background: rgba(35,21,41,0.75);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 6px 14px;
    font-size: 11px;
    color: var(--text-soft);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  #zoom-hint.show { opacity: 1; }
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="load-title">Mama's Coupon Book 💝</div>
  <div class="load-sub">Loading your keepsake...</div>
  <div class="load-bar"><div class="load-bar-fill" id="load-fill"></div></div>
</div>

<!-- App -->
<div id="app">

  <div id="stage">

  </div>

      Redeemed <span class="tab-count" id="count-redeemed">0</span>

</div>

<!-- Toast -->
<div id="toast"></div>
<div id="zoom-hint">Pinch to zoom · pan with one finger</div>

<!-- Firebase SDK (v9 compat) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// ─────────────────────────────────────────────
// CONFIGURATION
// ─────────────────────────────────────────────

// Firebase config — fill in after Firebase setup
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD0lw69GA2w88F16ohanIIjAWyp-en7ljc",
  authDomain: "mamas-coupon-book.firebaseapp.com",
  databaseURL: "https://mamas-coupon-book-default-rtdb.firebaseio.com",
  projectId: "mamas-coupon-book",
  storageBucket: "mamas-coupon-book.firebasestorage.app",
  messagingSenderId: "366844885505",
  appId: "1:366844885505:web:0c772f660e4a5e3ea19e00"
};

// Coupon data: pageIndex = 0-based PDF page (so page 3 = index 2)
// Each coupon: { name, category, frontPage (0-based), backPage (0-based) }
const COUPONS = [
  // Relax & Recharge
  { name: "Sweet Blessed Sleep-in",           category: "Relax & Recharge",        frontPage: 2,  backPage: 3  },
  { name: "Bubble Tub for Bubbs",             category: "Relax & Recharge",        frontPage: 4,  backPage: 5  },
  { name: "Room Service",                     category: "Relax & Recharge",        frontPage: 6,  backPage: 7  },
  { name: "Nap Time Isn't Just for Aubrey",   category: "Relax & Recharge",        frontPage: 8,  backPage: 9  },
  { name: "I Want Carbonara",                 category: "Relax & Recharge",        frontPage: 10, backPage: 11 },
  { name: "In Good Hands",                    category: "Relax & Recharge",        frontPage: 12, backPage: 13 },
  { name: "You've Been Served",               category: "Relax & Recharge",        frontPage: 14, backPage: 15 },
  // Treat Yo' Self
  { name: "Girl, Get Your Hair Did",          category: "Treat Yo' Self",          frontPage: 16, backPage: 17 },
  { name: "I Woke Up Like This",              category: "Treat Yo' Self",          frontPage: 18, backPage: 19 },
  { name: "Nailed It",                        category: "Treat Yo' Self",          frontPage: 20, backPage: 21 },
  { name: "Sweat it Out",                     category: "Treat Yo' Self",          frontPage: 22, backPage: 23 },
  // Just the Two of Us
  { name: "Mystery Date",                     category: "Just the Two of Us",      frontPage: 24, backPage: 25 },
  { name: "Olive the Gouda Stuff",            category: "Just the Two of Us",      frontPage: 26, backPage: 27 },
  { name: "Netflix and Actually Chill",       category: "Just the Two of Us",      frontPage: 28, backPage: 29 },
  // Squad Goals
  { name: "Who Thought Glitter Was a Good Idea?!", category: "Squad Goals",       frontPage: 30, backPage: 31 },
  { name: "Adventure Awaits",                 category: "Squad Goals",             frontPage: 32, backPage: 33 },
  { name: "Flour Power",                      category: "Squad Goals",             frontPage: 34, backPage: 35 },
  { name: "Sandwiched Between Your Favourites", category: "Squad Goals",           frontPage: 36, backPage: 37 },
  { name: "Best Day Ever with the Pack",      category: "Squad Goals",             frontPage: 38, backPage: 39 },
  // Wildcard
  { name: "Wildcard",                         category: "Wildcard",                frontPage: 40, backPage: 41 },
];

const TOTAL_PAGES = 44;

// Category accent colors
const CAT_COLORS = {
  "Relax & Recharge":   "#e8739a",
  "Treat Yo' Self":     "#b87fd4",
  "Just the Two of Us": "#f0a060",
  "Squad Goals":        "#60c4d0",
  "Wildcard":           "#f0c060",
};

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let currentPage = 0;       // 0-based
let redemptions = {};      // { couponIndex: "YYYY-MM-DD" } or null
let db = null;
let dashTab = 'available';
let imagesLoaded = 0;

// Zoom / pan state
let scale = 1;
let panX = 0, panY = 0;
let lastDist = 0;
let lastPanX = 0, lastPanY = 0;
let isPanning = false;
let touchStartX = 0, touchStartY = 0;
let touchStartTime = 0;
let isZoomed = false;
let activeCard = null;

// ─────────────────────────────────────────────
// BUILD PAGES
// ─────────────────────────────────────────────
function buildPages() {
  const stage = document.getElementById('stage');
  for (let i = 0; i < TOTAL_PAGES; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'page-wrap' + (i === 0 ? ' active' : ' hidden');
    wrap.dataset.page = i;

    const card = document.createElement('div');
    card.className = 'page-card';
    card.id = `card-${i}`;

    const img = document.createElement('img');
    // zero-pad to 2 digits
    img.src = `pages/${i + 1}.png`;
    img.alt = `Page ${i + 1}`;
    img.loading = i === 0 ? 'eager' : 'lazy';
    img.draggable = false;

    img.onload = () => {
      imagesLoaded++;
      updateLoadBar();
      if (imagesLoaded === 1) hideLoading();
    };
    img.onerror = () => {
      imagesLoaded++;
      updateLoadBar();
      if (imagesLoaded === 1) hideLoading();
    };

    card.appendChild(img);
    wrap.appendChild(card);
    stage.appendChild(wrap);
  }
}

function updateLoadBar() {
  const pct = Math.round((imagesLoaded / TOTAL_PAGES) * 100);
  document.getElementById('load-fill').style.width = pct + '%';
}

function hideLoading() {
  const el = document.getElementById('loading');
  el.classList.add('fade');
  setTimeout(() => el.remove(), 600);
}

// ─────────────────────────────────────────────
// NAVIGATION
// ─────────────────────────────────────────────
function goToPage(newPage, direction) {
  if (newPage < 0 || newPage >= TOTAL_PAGES) return;
  if (newPage === currentPage) return;

  resetZoom();

  const wraps = document.querySelectorAll('.page-wrap');
  const oldWrap = wraps[currentPage];
  const newWrap = wraps[newPage];

  // Remove hidden to allow transition
  newWrap.style.display = 'flex';
  newWrap.classList.remove('hidden', 'prev', 'next', 'active');

  const dir = direction ?? (newPage > currentPage ? 1 : -1);
  newWrap.classList.add(dir > 0 ? 'next' : 'prev');

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      oldWrap.classList.remove('active');
      oldWrap.classList.add(dir > 0 ? 'prev' : 'next');
      newWrap.classList.remove('prev', 'next');
      newWrap.classList.add('active');

      setTimeout(() => {
        oldWrap.classList.remove('prev', 'next');
        oldWrap.classList.add('hidden');
        oldWrap.style.display = '';
      }, 450);
    });
  });

  currentPage = newPage;
  updateUI();
}

function updateUI() {
  document.getElementById('counter-current').textContent = currentPage + 1;

  const prevBtn = document.getElementById('btn-prev');
  const nextBtn = document.getElementById('btn-next');
  prevBtn.classList.toggle('disabled', currentPage === 0);
  nextBtn.classList.toggle('disabled', currentPage === TOTAL_PAGES - 1);

  updateRedeemBtn();
  updateFab();
  updateStampOnCurrentPage();
}

// ─────────────────────────────────────────────
// COUPON HELPERS
// ─────────────────────────────────────────────
function getCouponForPage(pageIndex) {
  return COUPONS.find(c => c.frontPage === pageIndex);
}

function getCouponIndexForPage(pageIndex) {
  return COUPONS.findIndex(c => c.frontPage === pageIndex);
}

function isCouponFrontPage(pageIndex) {
  return COUPONS.some(c => c.frontPage === pageIndex);
}

// ─────────────────────────────────────────────
// REDEEM BUTTON
// ─────────────────────────────────────────────
function updateRedeemBtn() {
  const btn = document.getElementById('redeem-btn');
  const couponIdx = getCouponIndexForPage(currentPage);

  if (couponIdx === -1) {
    btn.style.display = 'none';
    return;
  }

  btn.style.display = '';
  const isRedeemed = !!redemptions[couponIdx];
  if (isRedeemed) {
    btn.className = 'redeemed';
    btn.textContent = '✓ Redeemed — tap to undo';
  } else {
    btn.className = 'available';
    btn.textContent = '🎟 Mark as Redeemed';
  }
}

document.getElementById('redeem-btn').addEventListener('click', () => {
  const couponIdx = getCouponIndexForPage(currentPage);
  if (couponIdx === -1) return;

  if (redemptions[couponIdx]) {
    // Undo
    delete redemptions[couponIdx];
    setRedemption(couponIdx, null);
    showToast('Coupon restored ✓');
  } else {
    // Redeem
    const today = new Date().toLocaleDateString('en-CA');
    redemptions[couponIdx] = today;
    setRedemption(couponIdx, today);
    showToast('Redeemed! 🎉');
  }

  updateUI();
  updateStampOnCurrentPage();
  updateDashboard();
});

// ─────────────────────────────────────────────
// STAMP OVERLAYS
// ─────────────────────────────────────────────
function updateStampOnCurrentPage() {
  const couponIdx = getCouponIndexForPage(currentPage);
  const card = document.getElementById(`card-${currentPage}`);
  if (!card) return;

  const existing = card.querySelector('.stamp-overlay');
  if (existing) existing.remove();

  if (couponIdx !== -1 && redemptions[couponIdx]) {
    const stamp = document.createElement('div');
    stamp.className = 'stamp-overlay';
    stamp.innerHTML = `
      <span class="stamp-word">Redeemed</span>
      <span class="stamp-date">${redemptions[couponIdx]}</span>
    `;
    card.appendChild(stamp);
  }
}

function refreshAllStamps() {
  COUPONS.forEach((c, idx) => {
    const card = document.getElementById(`card-${c.frontPage}`);
    if (!card) return;
    const existing = card.querySelector('.stamp-overlay');
    if (existing) existing.remove();
    if (redemptions[idx]) {
      const stamp = document.createElement('div');
      stamp.className = 'stamp-overlay';
      stamp.innerHTML = `
        <span class="stamp-word">Redeemed</span>
        <span class="stamp-date">${redemptions[idx]}</span>
      `;
      card.appendChild(stamp);
    }
  });
  updateUI();
  updateDashboard();
}

// ─────────────────────────────────────────────
// FAB + DASHBOARD
// ─────────────────────────────────────────────
function updateFab() {
  const count = Object.keys(redemptions).length;
  document.getElementById('fab-count').textContent = `${count} / 20`;
}

document.getElementById('fab').addEventListener('click', () => {
  document.getElementById('dashboard').classList.add('open');
  updateDashboard();
});
document.getElementById('dash-close').addEventListener('click', () => {
  document.getElementById('dashboard').classList.remove('open');
});

function switchTab(tab) {
  dashTab = tab;
  document.getElementById('tab-available').classList.toggle('active', tab === 'available');
  document.getElementById('tab-redeemed').classList.toggle('active', tab === 'redeemed');
  renderDashList();
}

function updateDashboard() {
  const redeemedCount = Object.keys(redemptions).length;
  const availableCount = 20 - redeemedCount;
  document.getElementById('count-available').textContent = availableCount;
  document.getElementById('count-redeemed').textContent = redeemedCount;
  document.getElementById('dash-subtitle').textContent =
    `${redeemedCount} redeemed · ${availableCount} remaining`;
  renderDashList();
}

function renderDashList() {
  const list = document.getElementById('dash-list');
  list.innerHTML = '';

  // Group by category
  const categories = [...new Set(COUPONS.map(c => c.category))];

  categories.forEach(cat => {
    const couponsInCat = COUPONS
      .map((c, i) => ({ ...c, idx: i }))
      .filter(c => c.category === cat)
      .filter(c => {
        const isRedeemed = !!redemptions[c.idx];
        return dashTab === 'redeemed' ? isRedeemed : !isRedeemed;
      });

    if (couponsInCat.length === 0) return;

    const label = document.createElement('div');
    label.className = 'dash-section-label';
    label.textContent = cat;
    list.appendChild(label);

    couponsInCat.forEach(c => {
      const item = document.createElement('div');
      item.className = 'coupon-list-item' + (redemptions[c.idx] ? ' redeemed' : '');

      const color = CAT_COLORS[c.category] || '#e8739a';
      const isRedeemed = !!redemptions[c.idx];

      item.innerHTML = `
        <div class="item-cat" style="background:${color}; width:4px; border-radius:3px; height:36px; flex-shrink:0;"></div>
        <div class="item-text">
          <div class="item-name">${c.name}</div>
          <div class="item-sub">${c.category}</div>
        </div>
        ${isRedeemed ? `<span class="redeemed-badge">✓ ${redemptions[c.idx]}</span>` : ''}
        <span class="item-arrow">›</span>
      `;

      item.addEventListener('click', () => {
        document.getElementById('dashboard').classList.remove('open');
        goToPage(c.frontPage);
      });

      list.appendChild(item);
    });
  });

  if (list.children.length === 0) {
    list.innerHTML = `<div style="text-align:center;padding:48px 0;color:var(--text-soft);font-size:14px;">
      ${dashTab === 'redeemed' ? 'No coupons redeemed yet 🎟' : 'All coupons redeemed! 🎉'}
    </div>`;
  }
}

// ─────────────────────────────────────────────
// TOUCH / SWIPE + ZOOM + PAN
// ─────────────────────────────────────────────
const stage = document.getElementById('stage');
let swipeStartX = 0, swipeStartY = 0;
let lastTouchX = 0, lastTouchY = 0;
let pinchStartScale = 1;
let velocityX = 0;
let lastMoveTime = 0;

function getActiveCard() {
  const wrap = document.querySelector('.page-wrap.active');
  return wrap ? wrap.querySelector('.page-card') : null;
}

function applyTransform() {
  const card = getActiveCard();
  if (!card) return;
  card.style.transform = `scale(${scale}) translate(${panX / scale}px, ${panY / scale}px)`;
  card.style.transition = isPanning ? 'none' : 'transform 0.2s ease';
}

function resetZoom() {
  scale = 1; panX = 0; panY = 0;
  isZoomed = false;
  const card = getActiveCard();
  if (card) {
    card.style.transform = '';
    card.style.transition = '';
  }
  document.getElementById('zoom-hint').classList.remove('show');
}

function clampPan() {
  const card = getActiveCard();
  if (!card) return;
  const rect = card.getBoundingClientRect();
  const maxX = Math.max(0, (rect.width * scale - window.innerWidth)  / 2);
  const maxY = Math.max(0, (rect.height * scale - window.innerHeight) / 2);
  panX = Math.max(-maxX, Math.min(maxX, panX));
  panY = Math.max(-maxY, Math.min(maxY, panY));
}

stage.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    swipeStartX = e.touches[0].clientX;
    swipeStartY = e.touches[0].clientY;
    lastTouchX  = swipeStartX;
    lastTouchY  = swipeStartY;
    touchStartTime = Date.now();
    isPanning = isZoomed;
    velocityX = 0;
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastDist = Math.hypot(dx, dy);
    pinchStartScale = scale;
    isPanning = false;
  }
}, { passive: true });

stage.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const newScale = Math.min(5, Math.max(1, pinchStartScale * (dist / lastDist)));

    if (newScale > 1 && !isZoomed) {
      isZoomed = true;
      document.getElementById('zoom-hint').classList.add('show');
      setTimeout(() => document.getElementById('zoom-hint').classList.remove('show'), 2000);
    }
    if (newScale <= 1.01) {
      scale = 1; panX = 0; panY = 0; isZoomed = false;
    } else {
      scale = newScale;
    }
    applyTransform();
    return;
  }

  if (e.touches.length === 1) {
    const dx = e.touches[0].clientX - lastTouchX;
    const dy = e.touches[0].clientY - lastTouchY;
    const now = Date.now();
    velocityX = dx / (now - lastMoveTime || 1);
    lastMoveTime = now;
    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;

    if (isZoomed) {
      e.preventDefault();
      panX += dx;
      panY += dy;
      clampPan();
      applyTransform();
    }
  }
}, { passive: false });

stage.addEventListener('touchend', e => {
  if (isZoomed) {
    isPanning = false;
    return;
  }

  const dx = e.changedTouches[0].clientX - swipeStartX;
  const dy = e.changedTouches[0].clientY - swipeStartY;
  const dt = Date.now() - touchStartTime;
  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);

  // Must be more horizontal than vertical, and a meaningful swipe
  if (absDx > 40 && absDx > absDy * 1.5 && dt < 500) {
    if (dx < 0) goToPage(currentPage + 1,  1);
    else         goToPage(currentPage - 1, -1);
  }
});

// Arrow buttons
document.getElementById('btn-prev').addEventListener('click', () => goToPage(currentPage - 1, -1));
document.getElementById('btn-next').addEventListener('click', () => goToPage(currentPage + 1,  1));

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goToPage(currentPage + 1,  1);
  if (e.key === 'ArrowLeft')  goToPage(currentPage - 1, -1);
  if (e.key === 'Escape') {
    document.getElementById('dashboard').classList.remove('open');
    if (isZoomed) resetZoom();
  }
});

// ─────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ─────────────────────────────────────────────
// FIREBASE REALTIME DATABASE
// ─────────────────────────────────────────────
function initFirebase() {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();

    // Listen for real-time updates
    db.ref('redemptions').on('value', snapshot => {
      const data = snapshot.val() || {};
      redemptions = data;
      refreshAllStamps();
    });
  } catch (err) {
    console.warn('Firebase not configured yet, running in local mode:', err.message);
    // Fallback: local storage only
    try {
      const saved = localStorage.getItem('coupon-redemptions');
      if (saved) redemptions = JSON.parse(saved);
    } catch(e) {}
    refreshAllStamps();
  }
}

function setRedemption(couponIdx, dateStr) {
  if (db) {
    if (dateStr) {
      db.ref(`redemptions/${couponIdx}`).set(dateStr);
    } else {
      db.ref(`redemptions/${couponIdx}`).remove();
    }
  } else {
    // Local fallback
    try { localStorage.setItem('coupon-redemptions', JSON.stringify(redemptions)); } catch(e) {}
  }
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
buildPages();
updateUI();
initFirebase();
</script>
